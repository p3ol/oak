name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # npm trusted publishing (OIDC)
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: yarn
      - name: Install deps
        run: yarn install
      - name: Publish packages
        run: yarn release:publish
      - name: Notify
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: success() || failure()
        with:
          webhook: ${{ secrets.SLACK_BOT_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "mrkdwn": true,
              "attachments": [{
                "mrkdwn_in": ["text"],
                "author_name": "${{ github.event.sender.login }}",
                "author_link": "${{ github.event.sender.html_url }}",
                "author_icon": "${{ github.event.sender.avatar_url }}",
                "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                "text": "${{ job.status == 'success' && format('Successfully published `{0}` to npm: check the <{1}|release notes>.', github.event.release.tag_name, github.event.release.html_url) || format('Failed to publish `{0}` to npm: check the <{1}/actions/runs/{2}|Action Run logs>.', github.event.release.tag_name, github.event.repository.html_url, github.run_id) }}",
                "unfurl_links": false,
                "footer": "p3ol/oak",
                "footer_icon": "https://i.imgur.com/WZNa9su.png"
              }]
            }
